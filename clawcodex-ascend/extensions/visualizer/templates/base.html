<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="stylesheet" href="/static/css/style.css?v=20260623-clean-base-1">
    {% block head %}{% endblock %}
</head>
<body>

        <div class="nav-brand"><a href="/">ClawCodex Visualizer</a></div>
