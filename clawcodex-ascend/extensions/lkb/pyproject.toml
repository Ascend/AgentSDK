[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lkb"
version = "0.2.0"
description = "Persistent Plan Graph runtime for ClawCodex TaskV2"
readme = "README.md"
