# Test 10: 有效的 direct 模式配置（最小化配置）
agentic_ai:
  mode: direct
  log_level: DEBUG
  log_dir: /var/log/

serve_conf:
  host: 0.0.0.0
  port: 8030

direct_conf:
  entrypoints:
    - job_type: train
      job_name: test-minimal-train
      job_kwargs: {}

train_instances:
  - name: test-minimal-train
    executor_num: 1
    executor_kwargs:
      cluster_mode: hybrid
      train_engine: verl
      train_config: {}
      rollout_config: {}
      agent_service: ""
      infer_service: ""
    resource_info: []

agent_instances: []
infer_instances: []
