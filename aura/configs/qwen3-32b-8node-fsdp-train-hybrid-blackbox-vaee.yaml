# =============================================================
# Agentic RL提供两种运行模式：
# 1. SERVE MODE     服务化部署，提供 HTTP/HTTPS 访问能力（如：多轮对话、模型推理等）
# 2. DIRECT MODE    直连模式，提供单次 JOB 执行能力（如：单次训练作业等）
# =============================================================
agentic_ai:
  mode: direct_with_serve # 模式选择：serve | direct
  log_level: DEBUG
  log_dir: /var/log/

serve_conf:
  host: 0.0.0.0
  port: 8030

direct_conf:
  entrypoints:
    - job_type: verl_train
      job_name: ${train_instances.0.name} # 即将训练的任务名称（默认为 `train_instances` 的第一个）
      job_kwargs: { }

# =============================================================
# Train 预定义任务：
# 1. 预定义任务包括采用RL框架类型、参数等等，初始化时占用资源，触发后开始训练（支持开始、暂停、取消）
# 2. SERVE 模式下，预定义任务列表默认为空; DIRECT 模式下，初始化任务等待触发训练（触发：direct_conf.entrypoints）
# =============================================================

# 根据rl框架和模型选择不同的模板，模板文件在msrl_conf/verl_conf路径下
hydra:
  searchpath:
    - file:///verl/verl/trainer/config
    - file:///home/ma-user/modelarts/user-job-dir/mindforge-coder-y-verl-0313/agentic_rl/configs/verl_conf # TODO: 需要泛华

defaults:
  - ppo_trainer
  - ppo_trainer@verl_conf
  - _self_

verl_conf:
  rllm:
    stepwise_advantage:
      enable: false
  extras:
    agent_service: ${agent_instances.0.name}  # 依赖的 AGENT 服务名称（默认为 `agent_instances` 的第一个）
    infer_service: ${infer_instances.0.name}  # 依赖的 INFER 服务名称（默认为 `infer_instances` 的第一个）
    traj_output_path: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/x00962718/TrainingOutput/qwen3_32b/2026_03_26_verl_r2e_fsdp_bb
  algorithm:
    adv_estimator: rloo   # from deepswe 5
    norm_adv_by_std_in_grpo:  False   # from deepswe 3
    kl_ctrl:
      kl_coef: 0.001
  data:
    train_files: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/data/qwen/r2e_gym_subset/R2E-Gym-Subset_with_instance_ids.parquet
    val_files: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/data/qwen/r2e_gym_subset/R2E-Gym-Subset_with_instance_ids.parquet
    train_batch_size: 4
    max_prompt_length: 4096
    max_response_length: 32768
    filter_overlong_prompts: True
    filter_overlong_prompts_workers: 64
    truncation: 'error'
  actor_rollout_ref:
    model:
      path: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/models/Qwen3-32B
      use_remove_padding: True
      enable_gradient_checkpointing: True

    actor:
      strategy: fsdp
      optim:
        lr: 1e-6
      entropy_coeff: 0.0
      ppo_mini_batch_size: 1
      ppo_micro_batch_size_per_gpu: 1
      use_kl_loss: False  # from deepswe 2
      calculate_entropy: False   # from deepswe 7
      kl_loss_coef: 0.001
      kl_loss_type: low_var_kl
      clip_ratio_high: 0.28  # from deepswe 1
      loss_agg_mode: seq-mean-token-sum  # from deepswe 4
      fsdp_config:
        param_offload: True
        optimizer_offload: True
        use_torch_compile: False
        model_dtype: bfloat16
      ulysses_sequence_parallel_size: 8
      use_torch_compile: False

    rollout:
      calculate_log_probs: True
      prompt_length: 16384
      response_length: 8192
      agent:
        agent_loop_manager_class: aura.trainer.train_adapter.verl.hybrid.agent_loop_manager.HybridAgentLoopManager
      log_prob_micro_batch_size_per_gpu: 1
      enable_chunked_prefill: True
      max_num_batched_tokens: 8192 # 32768
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      name: vllm
      gpu_memory_utilization: 0.8 # 0.6
      n: 4
      do_sample: False

    ref:
      log_prob_micro_batch_size_per_gpu: 1
      fsdp_config:
        param_offload: True
        use_torch_compile: False
        model_dtype: bfloat16
      use_torch_compile: False

  trainer:
    val_before_train: False
    device: npu
    critic_warmup: 0
    project_name: 'qwen3_32b_r2e_subset'
    experiment_name: 'qwen3_32b_r2e_subset'
    n_gpus_per_node: 8
    nnodes: 2
    save_freq: 1
    default_local_dir: /home/ma-user/modelarts/outputs/train_url_0/
    resume_mode: disable # disable / auto (load from default_local_dir) / resume_path  (load from resume_from_path)
    resume_from_path: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/x00962718/TrainingOutput/qwen3_32b/2026_03_26_verl_r2e_fsdp_bb/ckpts
    test_freq: 1000
    total_epochs: 1000
    logger: ['console','mlflow']
    rollout_data_dir: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/x00962718/TrainingOutput/qwen3_32b/2026_03_26_verl_r2e_fsdp_bb

train_instances:
  - name: RL-QWEN-32B-R2E-FSDP
    executor_num: 1
    executor_kwargs:
      # 以下参数为 TrainExecutor 初始化参数
      #      cluster_mode: hybrid  # hybrid(共卡) | one_step_off(分离) | dummy_train (训练只启动controller, 适配纯rollout验证)
      work_mode: hybrid  # hybrid(共卡) | one_step_off(分离) | dummy_train (训练只启动controller, 适配纯rollout验证)
      train_engine: verl
      train_config: ${verl_conf}
      rollout_config: { }
      agent_service: ${agent_instances.0.name}  # 依赖的 AGENT 服务名称（默认为 `agent_instances` 的第一个）
      infer_service: ${infer_instances.0.name}  # 依赖的 INFER 服务名称（默认为 `infer_instances` 的第一个）
    resource_info: [ ]  # MSRL 训练采用 RAY 实现资源分配，在 Executor 层不做资源限制


# =============================================================
# Agent 预置服务：
# 1. 提供如：Math / WebSearch 等智能体对话服务
# =============================================================
agent_instances:
  - name: SWE-AGENT
    executor_num: 1
    executor_kwargs:
      # 以下参数为 AgentExecutor 初始化参数
      agent_engine: vaee
      agent_engine_kwargs:
        # 以下参数为 rLLMEngineWrapper 初始化参数
        agent_name: swe-bb # RLLMEngineWrapper内置Agent，修改参见：agents/agents_mapping.py
        simplify_think_content: false
        max_prompt_length: 16384
        max_model_len: 32768
        n_parallel_agents: 128 # agent线程并发数
        env_args:
          max_steps: 5 # 50
          trajectory_timeout: 1800
          scaffold: r2egym
          dataset: r2e-gym-subset
          tool_timeout: 5400
          task_metadat_dir: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/x00962718/TrainingOutput/qwen3_32b/2026_03_26_verl_r2e_fsdp_bb
          harness: harness.r2e_blackbox_harness.R2EBlackBoxHarness
          tokenizer_path: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/models/Qwen3-32B
        agent_args:
          scaffold: r2egym
          overlong_filter: True
        traj_proxy_args:
          infer_url: "http://7.242.105.47"
        agent_proxy_args:
          agent_addr: ""
          traj_addr: "http://7.242.105.47"
          scaffold: r2egym
          dataset: r2e-gym-subset
          harness: harness.r2e_blackbox_harness.R2EBlackBoxHarness
        tokenizer: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/models/Qwen3-32B
        traj_reward_func: "aura.runner.agent_engine_wrapper.vaee_v2.default_traj_refine_reward_func.default_traj_reward_func"
      traj_proxy_url: "http://7.242.105.47"
      agent_proxy_url: "http://100.105.162.81:28124"
      infer_service_params: # 每轮对话时的 sampling params
        top_p: 1
        temperature: 1.0
        max_tokens: 4096
        model: ${infer_instances.0.name} # 依赖的 INFER 服务名称（默认为 `infer_instances` 的第一个）
      trajectory_save_dir: /Temp/bucket-siye-green-guiyang-code/MindForge-Coder/x00962718/TrainingOutput/qwen3_32b/2026_03_26_verl_r2e_fsdp_bb
    resource_info: [ ]

# =============================================================
# Infer 预置服务：
# 1. 提供如：QWen / Deepseek 等大模型推理服务
# 2. 提供 OpenAI Chat 推理接口
# =============================================================

infer_instances:
  - name: Qwen3-32B
    executor_num: 1
    executor_kwargs:
      # 以下参数为 InferExecutor 初始化参数
      engine: vllm_proxy
      engine_kwargs:
        # 以下参数为 vLLMInferServer 初始化参数
        chat_server: "http://0.0.0.0:8080"
        prefill_server_list: [ ]
        decode_server_list: [ ]
        model_name: Qwen3-32B
    resource_info: [ ]
