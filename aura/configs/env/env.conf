# ============================================================
# Aura 一键拉起环境变量配置
# 本文件集中管理所有脚本中使用的环境变量
# 用户可在 env.local 中覆盖本文件的配置（env.local 不入库）
# 加载优先级: 环境变量(已export) > env.local > env.conf > 脚本默认值
#
# ============================================================
# env.local 使用说明（如何覆盖本文件）
# ============================================================
# 1) 创建文件（与 env.conf 同目录，仅在本机生效，已加入 .gitignore）:
#      touch aura/configs/env/env.local
# 2) 按 KEY=VALUE 格式写入需要覆盖的变量，每行一条，例如:
#      DEFAULT_SOCKET_IFNAME=bond19
#      USE_VLLM_OPT=false
# 3) 加载优先级: 命令行 export  >  env.local  >  env.conf
# 4) key 必须匹配 [A-Za-z_][A-Za-z0-9_]* (POSIX 变量命名规范), 否则告警并跳过
# 5) value 中的 $(...) / `cmd` 不会被执行, 仅作为字符串赋值
#
# ============================================================
# env.conf vs infer yaml / 训练 yaml 的覆盖关系
# ============================================================
# 1) 推理段 ([infer]) 中带"【会被 infer yaml 覆盖】"标注的变量,
#    最终值由 aura/scripts/infer/vllm/parse_infer_config.sh 通过 get_yaml.py
#    读取 configs/infer/vllm_infer_*.yaml 后 export 覆盖; env.conf 的值仅
#    作为 yaml 读取之前的初始默认值。
# 2) 训练段 ([train]) 配置进程运行环境；模型和训练超参数仍在
#    configs/train/*.yaml 中配置，两类配置的职责不同。
# 3) 上述加载优先级仅适用于 load_env.sh 管理的环境变量。infer yaml 中的
#    同名配置会在后续解析阶段覆盖环境变量；如需修改，请编辑对应 yaml。
# ============================================================


# ========================
# [system] 系统与CANN环境
# ========================
# HCCL通信协议族
HCCL_SOCKET_FAMILY=AF_INET
# Python安装路径（用于拼接LD_LIBRARY_PATH）。留空时由 load_env.sh 自动探测当前 python3 安装前缀。
PYTHON_HOME=
# ACLNN运行时缓存
ACLNN_ALLOW_RUNTIME_CACHE=1
# NPU后端自动加载
TORCH_DEVICE_BACKEND_AUTOLOAD=1
# Ascend日志级别
ASCEND_GLOBAL_LOG_LEVEL=3
# OpenMP线程绑定
OMP_PROC_BIND=false
# Ascend同步模式
ASCEND_LAUNCH_BLOCKING=0

# ========================
# [network] 网络与通信
# ========================
# 默认网卡名，所有通信组件使用
DEFAULT_SOCKET_IFNAME=eth0
# HCCL缓冲区大小（不同场景使用不同值: 训练200, 推理256, 推理优化512）
HCCL_BUFFSIZE_TRAIN=200
HCCL_BUFFSIZE_INFER=256
HCCL_BUFFSIZE_INFER_OPT=512
# HCCL超时配置（秒）: 训练1800, 推理1200
HCCL_CONNECT_TIMEOUT_TRAIN=1800
HCCL_EXEC_TIMEOUT_TRAIN=1800
HCCL_CONNECT_TIMEOUT_INFER=1200
HCCL_EXEC_TIMEOUT_INFER=1200
# HCCL端口范围（hybrid模式使用）
HCCL_HOST_SOCKET_PORT_RANGE=auto
HCCL_NPU_SOCKET_PORT_RANGE=auto
# HCCL算子扩展模式
HCCL_OP_EXPANSION_MODE=AIV
# HCCL RoCE使能
HCCL_INTRA_ROCE_ENABLE=1

# ========================
# [path] 第三方组件相对路径（相对于WORKSPACE）
# ========================
RLLM_REL_PATH=third_party/agent_engine/rllm
VLLM_REL_PATH=third_party/infer/vllm
VLLM_ASCEND_REL_PATH=third_party/infer/vllm_ascend
MINDSPEED_RL_REL_PATH=third_party/rl/mindspeed_rl
MEGATRON_REL_PATH=third_party/rl/megatron
MINDSPEED_REL_PATH=third_party/rl/mindspeed
MINDSPEED_LLM_REL_PATH=third_party/rl/mindspeed_llm

# ========================
# [train] 训练配置
# ========================
# RL训练后端
RL_TRAIN_BACKEND=verl
# PyTorch NPU内存分配
PYTORCH_NPU_ALLOC_CONF=expandable_segments:False
# 禁用Triton自动调优
TRITON_DISABLE_AUTOTUNE=1
# 配置文件扩展名
CONFIG_EXT=.yaml

# ========================
# [infer] 推理配置
# 标注"【会被 infer yaml 覆盖】"的变量, 最终值由 parse_infer_config.sh 从
# configs/infer/vllm_infer_*.yaml 读取后 export 覆盖; env.conf 仅提供
# parse_infer_config.sh 之前阶段的初始默认值。
# ========================
# VLLM版本  【会被 infer yaml(vllm_version) 覆盖】
VLLM_VERSION=0.16.0
# Ray可见设备控制
RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES=1
# 工作负载日志
LOG_WORKLOAD_ENABLE=0
# VLLM v1引擎
VLLM_USE_V1=1
# TopK优化
VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1
# 任务队列使能（1:普通, 2:prefill专用）
TASK_QUEUE_ENABLE=1
# NIXL超时（秒）
VLLM_NIXL_ABORT_REQUEST_TIMEOUT=600
# Mooncake传输超时（秒）
MC_TRANSFER_TIMEOUT=300
# RPC超时（毫秒）
VLLM_RPC_TIMEOUT=600000
# 引擎迭代超时（秒）
VLLM_ENGINE_ITERATION_TIMEOUT_S=600
# 共享内存广播超时（秒）
VLLM_SHM_BROADCAST_TIMEOUT=600
# 开发模式（使能collective_rpc接口）
VLLM_SERVER_DEV_MODE=1
# KV传输后端  【会被 infer yaml(kv_backend) 覆盖】; 取值: llmdatadist 或 mooncake
KV_BACKEND=llmdatadist
# VLLM优化开关  【会被 infer yaml(use_vllm_opt) 覆盖】
# 选值统一为 true/false (vllm_serve.sh 通过 [ "$USE_VLLM_OPT" = "false" ] 判断)
USE_VLLM_OPT=false
# DP RPC端口
DP_RPC_PORT=13397
# LLMDD RPC端口
VLLM_ASCEND_LLMDD_RPC_PORT=7778
# PD分离默认rank table路径
DISAGGREGATED_PREFILL_RANK_TABLE_PATH=/ranktable.json
# CANN vendors op_api 路径
CANN_OPP_VENDORS_OP_API_LIB=/usr/local/Ascend/ascend-toolkit/latest/opp/vendors/customize/op_api/lib/
