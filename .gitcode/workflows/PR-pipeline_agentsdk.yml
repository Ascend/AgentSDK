name: PR-pipeline_agentsdk

on:
  pr_comment:
    types: [created]
    keyword: '^compile$'
  pull_request_comment:
    types: [ created ]
    branches: [ 'master', 'release/v26.2.0', '26.1.0', '26.0.0' ]
    comments: [ '^compile$' ]

env:
  repo_name: ${{ atomgit.event.repository.name }}
  REMOTE_URL: ${{ atomgit.repositoryurl }}
  PR_ID: ${{ atomgit.event.pull_request.number }}
  org_name: "Ascend"

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write

stages:
  stage_0:
    name: CodeCheck
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ self-hosted, x86, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build: ${{ steps.set-skip.outputs.need_build }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.PR_ID }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.PR_ID }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'

          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "need_build=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build=no" >> "$ATOMGIT_OUTPUT"
              fi

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ env.repo_name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ env.repo_name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage_1:
    name: CodeCheck_Build_Test
    select: selected_by_default
    jobs:
      pre-commit:
        name: pre-commit
        runs-on: [ self-hosted, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
          options: --user root
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || '' }}
          - name: gitleaks install
            run: |
              wget -q --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
          - name: setup-python311
            run: |
              ln -sf /usr/local/bin/python3.11 /usr/bin/python
              python --version
          - name: run pre-commit
            uses: openlibing-pre-commit-action

      SCA:
        name: SCA
        runs-on: [ self-hosted, x86, cpu=8 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
          options: --user root
        steps:
          - name: checkout
            uses: checkout
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: MindCluster

      malicious-scan:
        name: antipoison
        runs-on: [ self-hosted, x86, cpu=8 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
          options: --user root
        steps:
          - name: Checkout
            uses: checkout
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: MindCluster

      SAST:
        name: PR-SAST-check
        runs-on: [ self-hosted, x86, cpu=8 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ascend-mindx/mindx_x86:mindxdl_go1207_20251203
          options: --user root
        steps:
          - name: git upgrade
            run: |
              apt-get update
              apt-get install -y software-properties-common
              add-apt-repository ppa:git-core/ppa -y
              apt-get update
              apt-get install -y git
              git --version
          - name: checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || '' }}
          - name: checkout AI-Check
            run: |
              set -x
              git clone -b main https://gitcode.com/TuBee/AI-Check.git AI-Check
          - name: run check
            run: |
              set -x
              export ACCESS_TOKEN="${{ secrets.ACCESS_QK }}"
              export __repository__="${{ env.REMOTE_URL }}"
              cd ${ATOMGIT_WORKSPACE}/AI-Check
              bash check.sh

      Build_arm:
        name: Build_arm
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.build_job.yml
        with:
          IMAGE_FLAG: "swr.cn-north-4.myhuaweicloud.com/ascend-mindx/mindx_arm:SDK_20251230_1"
          runs_on_arch: "arm64"

      UT_python_aura:
        name: UT_python_aura
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.ut_python.yml
        with:
          IMAGE_FLAG: "swr.cn-north-4.myhuaweicloud.com/ascend-mindx/mindx_x86:mindxdl_go1207_20251225_sdk1"
          runs_on_arch: "x64"
          UT_SCRIPT: "script/aura_ut.sh"
          CHANGE_PATTERN: "aura/|presmoke/aura/"

      UT_python_openclaw:
        name: UT_python_openclaw
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.ut_python.yml
        with:
          IMAGE_FLAG: "swr.cn-north-4.myhuaweicloud.com/ascend-mindx/mindx_x86:mindxdl_go1207_20251225_sdk1"
          runs_on_arch: "x64"
          UT_SCRIPT: "script/openclaw_ut.sh"
          CHANGE_PATTERN: "openclaw/|presmoke/openclaw/"

  stage_2:
    name: Test
    select: selected_by_default
    jobs:
      PreSmoke_aura:
        name: PreSmoke_aura
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.presmoke.yml
        with:
          IMAGE_FLAG: "swr.cn-north-4.myhuaweicloud.com/ascend-mindx/mindx_arm:AgentSDK_26.0.0"
          runs_on_arch: "arm64"
          SMOKE_SCRIPT: "run_presmoke_aura.sh"
          SMOKE_COMPONENT: "AgentSDK"
          CHANGE_PATTERN: "aura/|presmoke/aura/"

      PreSmoke_openclaw:
        name: PreSmoke_openclaw
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' }}
        uses: .gitcode/workflows/.presmoke.yml
        with:
          IMAGE_FLAG: "swr.cn-south-1.myhuaweicloud.com/ascendhub/openclaw:2026.5.22"
          runs_on_arch: "arm64"
          SMOKE_SCRIPT: "run_presmoke_openclaw.sh"
          SMOKE_COMPONENT: "AgentSDK"
          CHANGE_PATTERN: "openclaw/|presmoke/openclaw/"
          EXTRA_SETUP: true

      PreSmoke_clawcodex:
        name: PreSmoke_clawcodex
        if: ${{ jobs.Detect_file_changes.outputs.need_build == 'yes' && atomgit.event.pull_request.base.ref == 'tech_v26.2.0' }}
        uses: .gitcode/workflows/.presmoke.yml
        with:
          IMAGE_FLAG: "swr.cn-south-1.myhuaweicloud.com/ascendhub/openclaw:2026.5.22"
          runs_on_arch: "arm64"
          SMOKE_SCRIPT: "run_presmoke_clawcodex.sh"
          SMOKE_COMPONENT: "AgentSDK"
          CHANGE_PATTERN: "clawcodex-ascend/|presmoke/clawcodex/"

post:
  jobs:
    query_pipeline:
      runs-on: [ self-hosted, x86, cpu=16 ]
      container:
        image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ env.repo_name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ atomgit.event.pull_request.number }}
            apply_label: 'true'
