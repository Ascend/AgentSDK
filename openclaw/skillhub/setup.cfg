[metadata]
name = skillhub-cli
version = 0.1.0

[options]
package_dir =
    skillhub = .
packages =
    skillhub
    skillhub.adapters
    skillhub.commands
    skillhub.exceptions
    skillhub.interfaces
    skillhub.models
    skillhub.services
    skillhub.utils
python_requires = >=3.9
install_requires =
    typer
    rich
    pydantic
    pydantic-settings
    platformdirs
    httpx[http2]
    diskcache
    keyring
    keyrings.alt
    pyyaml

[options.entry_points]
console_scripts =
    skillhub = skillhub.cli:run
